name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  build_and_test:
    uses: amqp-rs/actions/.github/workflows/reusable-build.yml@main
    with:
      setup: openssl-vcpkg
      # Fail a hung test run sooner than the shared workflow's 60 minutes.
      timeout-minutes: 30
