name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    # Fail a hung test run long before GitHub's 6-hour default.
    timeout-minutes: 30
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: nightly
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: msrv
    steps:
      - uses: amqp-rs/actions/checkout@main
      - uses: amqp-rs/actions/openssl-vcpkg@main
      - uses: amqp-rs/actions/build@main
        with:
          rust: ${{ matrix.rust }}
